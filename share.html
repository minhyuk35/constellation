<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05040d" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="누군가 방금 완성한 별자리를 개인정보 없이 이미지로 저장하세요."
    />
    <title>내 별자리 저장하기 — Constellation</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E✧%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles/share.css" />
  </head>
  <body>
    <main class="share-card">
      <p class="share-brand"><b>constellation.</b> 별로 그리는 사람</p>
      <canvas id="share-canvas" width="1080" height="1350" aria-hidden="true"></canvas>
      <div class="share-title" id="share-title" hidden>
        <strong></strong><span></span>
      </div>
      <p id="share-description" hidden></p>
      <p id="share-empty" hidden>불러올 별자리를 찾지 못했어요. QR을 다시 스캔해 주세요.</p>
      <button id="share-download" hidden>이미지로 저장하기</button>
      <p class="share-hashtag" id="share-hashtag" hidden>#ConstellationOfYou</p>
      <p class="share-note">
        이 이미지는 별의 위치와 연결선만으로 그려졌어요. 촬영된 영상이나 개인정보는 담겨 있지
        않습니다.
      </p>
    </main>
    <script type="module" src="/src/share-main.js"></script>
  </body>
</html>
